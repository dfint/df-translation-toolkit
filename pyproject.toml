[project]
name = "df-translation-toolkit"
version = "0.13.0"
description = "Toolset to convert text extracted from DF to translation format and aback"
authors = [
    { name = "insolor", email = "insolor@gmail.com" },
    { name = "aNNiPAk", email = "annipak@yandex.ru" },
    { name = "shevernitskiy", email = "hwork@list.ru" },
]
requires-python = ">=3.12,<4"
license = "MIT"
dependencies = [
    "Unidecode>=1.4.0,<2",
    "loguru>=0.7.3,<0.8",
    "babel>=2.17.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.0.0,<8",
    "pytest-mock>=3.15.1,<4",
    "coverage>=7.15.2,<8",
    "ruff>=0.16.0,<0.18",
    "mypy>=2.3.0,<3",
]

[tool.uv]
default-groups = [
    "dev",
]

[tool.uv.workspace]
members = [
    "notebooks",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
packages = ["df_translation_toolkit"]

[tool.hatch.build.targets.wheel]
packages = ["df_translation_toolkit"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "RUF001",
    "ANN002",
    "ANN003",
    "PTH123",
    "T201",
    "FIX001",
    "FIX002",
    "TD001",
    "TD003",
    "N818",
    "PLW1641",
    "CPY001",
]
fixable = ["ALL"]
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",   # Don't warn about using of asserts in tests
    "D",      # Don't warn about missing documentation in tests
    "PT006",
    "PT007",
    "E501",
]

"notebooks/*" = [
    "INP001",
    "PLC0415",
    "ANN001",
    "ANN202",
    "N803",
    "B018",
    "PLR1711",
]

[tool.mypy]
exclude = [
  "notebooks",
]
