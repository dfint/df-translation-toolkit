[project]
name = "df-translation-toolkit-cli"
version = "0.1.0"
description = "Command-line interface for df-translation-toolkit"
requires-python = ">=3.10,<4"
dependencies = [
    "df-translation-toolkit",
    "typer>=0.27.0,<0.28",
]

[project.scripts]
df-translation-toolkit = "cli:app"

[tool.uv.sources]
df-translation-toolkit = { path = ".." }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]
