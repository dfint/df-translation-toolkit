name: Draft Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Install uv
        run: pipx install uv
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      
      - name: Build project
        id: build
        run: |
          uv build
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          tag_name: ${{ steps.build.outputs.version }}
          draft: true
